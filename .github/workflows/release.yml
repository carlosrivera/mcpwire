name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect OIDC
        run: |
          echo "npm version: $(npm -v)"
          echo "node version: $(node -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC URL is present"
          else
            echo "OIDC URL is MISSING"
          fi

      - name: Install dependencies
        run: npm --prefix cli ci

      - name: Build CLI
        run: npm --prefix cli run build

      - name: Run CLI tests
        run: npm --prefix cli test

      - name: Publish @mcpwire/cli
        run: |
          cd cli
          npm publish --access public
