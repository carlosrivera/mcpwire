name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Install CLI dependencies
        run: npm --prefix cli ci

      - name: Build CLI
        run: npm --prefix cli run build

      - name: Run CLI tests
        run: npm --prefix cli test

      - name: Publish @mcpwire/cli
        run: |
          CURRENT_VERSION=$(node -p "require('./cli/package.json').version")
          if npm view "@mcpwire/cli@${CURRENT_VERSION}" version >/dev/null 2>&1; then
            echo "@mcpwire/cli@${CURRENT_VERSION} is already published on npm. Skipping publish."
            exit 0
          fi
          cd cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ""

