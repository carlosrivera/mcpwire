name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Inspect Decoded OIDC Token Claims
        run: |
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.npmjs.org")
          JWT=$(echo "$RESPONSE" | jq -r .value)
          echo "=== Decoded GitHub OIDC Claims ==="
          echo "$JWT" | cut -d '.' -f 2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{aud, iss, repository, repository_owner, job_workflow_ref, ref, workflow}' || true

      - name: Install dependencies
        run: npm --prefix cli ci

      - name: Build CLI
        run: npm --prefix cli run build

      - name: Run CLI tests
        run: npm --prefix cli test

      - name: Publish @mcpwire/cli
        run: |
          cd cli
          npm publish --access public --registry=https://registry.npmjs.org/
