name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inspect Environment & OIDC
        run: |
          echo "npm version: $(npm -v)"
          echo "node version: $(node -v)"
          npm config list

      - name: Install dependencies
        run: npm --prefix cli ci

      - name: Build CLI
        run: npm --prefix cli run build

      - name: Run CLI tests
        run: npm --prefix cli test

      - name: Publish @mcpwire/cli
        run: |
          cd cli
          npm publish --access public --registry=https://registry.npmjs.org/
