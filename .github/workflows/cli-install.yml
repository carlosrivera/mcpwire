name: Validate CLI package installation
on:
  pull_request:
    paths: ['cli/**', 'pnpm-lock.yaml', '.github/workflows/cli-install.yml']
  push:
    branches: [main]
    paths: ['cli/**', 'pnpm-lock.yaml', '.github/workflows/cli-install.yml']
permissions:
  contents: read
jobs:
  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cli
      - run: pnpm --filter @mcpwire/cli run test:install
